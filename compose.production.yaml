name: nevis

services:
  dashboard:
    image: ${NEVIS_IMAGE:?Set NEVIS_IMAGE to the GHCR image digest}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5180"
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        aliases:
          - nevis-dashboard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: personal-api_default
