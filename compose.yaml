services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    command: sh -c "npm ci && exec npm run dev"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "5180"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${PORT:-5180}:5180"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
